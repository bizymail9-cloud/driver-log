<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receipt Log</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Helvetica,Arial,sans-serif; margin:0; background:#fff; color:#000;}
  header{padding:12px 16px; border-bottom:2px solid #000; display:flex; justify-content:space-between; align-items:center;}
  header h1{font-size:16px; margin:0;}
  .btnbar{display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px;}
  button{padding:10px 12px; font-size:13px; border:2px solid #000; background:#fff; color:#000; border-radius:6px; font-weight:bold;}
  button.primary{background:#000; color:#fff;}
  button.mic{border-radius:50%; width:52px; height:52px; padding:0; font-size:20px;}
  button.mic.listening{background:#c00; color:#fff; border-color:#c00;}
  #voiceStatus{font-size:12px; color:#666; padding:0 16px 6px;}
  #camInput, #fileInput{display:none;}
  #cropStage{padding:10px 16px; display:none;}
  #cropCanvasWrap{position:relative; border:1px solid #000; max-width:100%; overflow:auto; touch-action:none;}
  #cropCanvas{max-width:100%; display:block;}
  .handle{position:absolute; width:20px; height:20px; background:#0f0; border:2px solid #000; border-radius:50%; touch-action:none; transform:translate(-50%,-50%);}
  .formGrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 16px;}
  .formGrid label{font-size:11px; color:#666; display:block;}
  .formGrid input, .formGrid select{width:100%; padding:8px; font-size:13px; border:1px solid #000; border-radius:4px;}
  .full{grid-column:1 / -1;}
  table{width:100%; border-collapse:collapse; font-size:11px; margin:10px 16px; width:calc(100% - 32px);}
  th,td{border:1px solid #000; padding:5px; text-align:left;}
  th{background:#000; color:#fff; font-size:10px;}
  td img{width:44px; height:44px; object-fit:cover; border:1px solid #000;}
  .section-title{font-weight:bold; margin:14px 16px 4px; font-size:14px; border-bottom:1px solid #000; padding-bottom:2px;}
  #ocrStatus{font-size:12px; color:#666; padding:4px 16px;}
</style>
</head>
<body>

<header>
  <h1>Receipt Log</h1>
  <button onclick="exportJSON()">Save/Export</button>
</header>
<div style="padding:8px 16px; border-bottom:1px solid #000; font-size:13px; font-weight:bold; background:#f7f7f7;">
  Total (auto): $<span id="grandTotal">0.00</span> across <span id="receiptCount">0</span> receipts
</div>

<div class="btnbar">
  <button class="primary" onclick="document.getElementById('camInput').click()">📷 Take Photo</button>
  <button onclick="document.getElementById('fileInput').click()">Upload Photo</button>
  <input type="file" id="camInput" accept="image/*" capture="environment" onchange="handlePhoto(event)">
  <input type="file" id="fileInput" accept="image/*" onchange="handlePhoto(event)">
  <button class="mic" id="micBtn" onclick="toggleMic()">🎤</button>
</div>
<div id="voiceStatus">Tap mic and say e.g. "45 dollars Pilot Travel Center diesel"</div>

<!-- CROP STAGE -->
<div id="cropStage">
  <div class="section-title" style="margin:0 0 6px;">Adjust corners, then confirm crop</div>
  <div id="cropCanvasWrap">
    <canvas id="cropCanvas"></canvas>
    <div class="handle" id="h0"></div>
    <div class="handle" id="h1"></div>
    <div class="handle" id="h2"></div>
    <div class="handle" id="h3"></div>
  </div>
  <div class="btnbar">
    <button onclick="autoDetectEdges()">Auto-Straighten</button>
    <button class="primary" onclick="confirmCrop()">Confirm Crop &amp; Read Receipt</button>
    <button onclick="cancelCrop()">Cancel</button>
  </div>
  <div id="ocrStatus"></div>
</div>

<!-- ENTRY FORM -->
<div class="formGrid" id="entryForm" style="display:none;">
  <div class="full"><img id="thumbPreview" style="max-width:140px; border:1px solid #000; display:block; margin-bottom:6px;"></div>
  <div><label>Date</label><input id="f_date"></div>
  <div><label>Vendor</label><input id="f_vendor"></div>
  <div><label>Amount ($)</label><input id="f_amount"></div>
  <div><label>Category</label>
    <select id="f_category">
      <option>Fuel</option><option>Maintenance</option><option>Toll</option>
      <option>Lodging</option><option>Meals</option><option>Other</option>
    </select>
  </div>
  <div class="full"><label>Notes</label><input id="f_notes"></div>
  <div class="full">
    <button class="primary" onclick="saveEntry()">Save Receipt</button>
    <button onclick="discardEntry()">Discard</button>
  </div>
</div>

<div class="section-title">Saved Receipts</div>
<table>
  <thead><tr><th>Photo</th><th>Date</th><th>Vendor</th><th>Amount</th><th>Category</th><th></th></tr></thead>
  <tbody id="receiptBody"></tbody>
</table>

<div class="btnbar">
  <button class="primary" onclick="exportJSON()">Download JSON Backup</button>
  <button onclick="document.getElementById('importFile').click()">Import JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  <button onclick="if(confirm('Clear ALL receipts?'))clearAll()">Clear All</button>
</div>

<script>
const STORAGE_KEY = 'receiptLog_v1';
let receipts = [];
let memoryStore = {};

function safeGetItem(key){
  try{ return localStorage.getItem(key); }
  catch(e){ return Object.prototype.hasOwnProperty.call(memoryStore,key) ? memoryStore[key] : null; }
}
function safeSetItem(key,val){
  try{ localStorage.setItem(key,val); }
  catch(e){ memoryStore[key]=val; showErrorBanner('Storage is restricted here — changes will NOT be saved after you close this page. Try opening this file over a real web link instead of a downloaded file.'); }
}
function showErrorBanner(msg){
  let b = document.getElementById('errBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'errBanner';
    b.style.cssText = 'background:#c00;color:#fff;padding:8px 16px;font-size:12px;position:fixed;bottom:0;left:0;right:0;z-index:999;';
    document.body.appendChild(b);
  }
  b.textContent = msg;
}
window.onerror = function(msg, url, line){
  showErrorBanner('App error: ' + msg + ' (line ' + line + ') — tell Claude this exact message.');
};
let corners = []; // {x,y} x4 in canvas coords
let sourceImg = null;
let pendingEntry = null;

function loadData(){
  const raw = safeGetItem(STORAGE_KEY);
  try{ receipts = raw ? JSON.parse(raw) : []; }catch(e){ receipts = []; }
}
function saveData(){
  safeSetItem(STORAGE_KEY, JSON.stringify(receipts));
  renderTable();
}

function handlePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    sourceImg = new Image();
    sourceImg.onload = ()=>{ openCropStage(); };
    sourceImg.src = reader.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function openCropStage(){
  document.getElementById('entryForm').style.display='none';
  document.getElementById('cropStage').style.display='block';
  const canvas = document.getElementById('cropCanvas');
  const maxW = Math.min(sourceImg.width, window.innerWidth - 40);
  const scale = maxW / sourceImg.width;
  canvas.width = sourceImg.width * scale;
  canvas.height = sourceImg.height * scale;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(sourceImg, 0, 0, canvas.width, canvas.height);
  // default corners = full image with small inset margin
  const m = Math.min(canvas.width, canvas.height) * 0.04;
  corners = [
    {x:m, y:m}, {x:canvas.width-m, y:m},
    {x:canvas.width-m, y:canvas.height-m}, {x:m, y:canvas.height-m}
  ];
  placeHandles();
}

function placeHandles(){
  const wrap = document.getElementById('cropCanvasWrap');
  for(let i=0;i<4;i++){
    const h = document.getElementById('h'+i);
    h.style.left = corners[i].x + 'px';
    h.style.top = corners[i].y + 'px';
    makeDraggable(h, i);
  }
}
function makeDraggable(el, idx){
  el.onpointerdown = (e)=>{
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const wrap = document.getElementById('cropCanvasWrap');
    const move = (ev)=>{
      const rect = wrap.getBoundingClientRect();
      let x = ev.clientX - rect.left + wrap.scrollLeft;
      let y = ev.clientY - rect.top + wrap.scrollTop;
      corners[idx] = {x,y};
      el.style.left = x+'px'; el.style.top = y+'px';
    };
    const up = ()=>{ window.removeEventListener('pointermove',move); window.removeEventListener('pointerup',up); };
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  };
}

// Simple auto-straighten: detects a high-contrast bounding rectangle via
// edge-intensity scan on grayscale, falls back to a tighter inset if it fails.
function autoDetectEdges(){
  const canvas = document.getElementById('cropCanvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const imgData = ctx.getImageData(0,0,w,h).data;
  function gray(x,y){
    const i = (y*w+x)*4;
    return 0.299*imgData[i] + 0.587*imgData[i+1] + 0.114*imgData[i+2];
  }
  // scan inward from each edge until contrast jump found (simple receipt-on-table detector)
  function scanRow(y, dir){
    let prev = gray(dir>0?0:w-1, y);
    for(let x = dir>0?1:w-2; dir>0? x<w : x>=0; x+=dir){
      const g = gray(x,y);
      if(Math.abs(g-prev) > 35) return x;
      prev = g;
    }
    return dir>0 ? Math.floor(w*0.05) : Math.floor(w*0.95);
  }
  function scanCol(x, dir){
    let prev = gray(x, dir>0?0:h-1);
    for(let y = dir>0?1:h-2; dir>0? y<h : y>=0; y+=dir){
      const g = gray(x,y);
      if(Math.abs(g-prev) > 35) return y;
      prev = g;
    }
    return dir>0 ? Math.floor(h*0.05) : Math.floor(h*0.95);
  }
  const midY = Math.floor(h/2), midX = Math.floor(w/2);
  const left = scanRow(midY, 1);
  const right = scanRow(midY, -1);
  const top = scanCol(midX, 1);
  const bottom = scanCol(midX, -1);
  corners = [{x:left,y:top},{x:right,y:top},{x:right,y:bottom},{x:left,y:bottom}];
  placeHandles();
  document.getElementById('ocrStatus').textContent = 'Auto-straighten applied — drag corners to fine-tune if needed.';
}

function confirmCrop(){
  const canvas = document.getElementById('cropCanvas');
  const scaleX = sourceImg.width / canvas.width;
  const scaleY = sourceImg.height / canvas.height;
  // bounding box of the 4 corners (simple axis-aligned crop; good enough for phone photos)
  const xs = corners.map(c=>c.x), ys = corners.map(c=>c.y);
  const x0 = Math.min(...xs)*scaleX, x1 = Math.max(...xs)*scaleX;
  const y0 = Math.min(...ys)*scaleY, y1 = Math.max(...ys)*scaleY;
  const cw = Math.max(10, x1-x0), ch = Math.max(10, y1-y0);

  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(sourceImg, x0, y0, cw, ch, 0, 0, cw, ch);
  const croppedDataUrl = out.toDataURL('image/jpeg', 0.85);

  pendingEntry = { photo: croppedDataUrl, date:'', vendor:'', amount:'', category:'Fuel', notes:'' };
  document.getElementById('cropStage').style.display='none';
  document.getElementById('entryForm').style.display='grid';
  document.getElementById('thumbPreview').src = croppedDataUrl;
  document.getElementById('f_date').value='';
  document.getElementById('f_vendor').value='';
  document.getElementById('f_amount').value='';
  document.getElementById('f_notes').value='';

  runOCR(croppedDataUrl);
}

function cancelCrop(){
  document.getElementById('cropStage').style.display='none';
}

function runOCR(dataUrl){
  document.getElementById('ocrStatus').textContent = '';
  const status = id=>document.getElementById(id);
  const formStatus = document.createElement('div');
  document.getElementById('entryForm').insertAdjacentHTML('afterbegin','<div class="full" id="ocrRunning" style="font-size:12px;color:#666;">Reading receipt (OCR)…</div>');
  if(typeof Tesseract === 'undefined'){
    const el = document.getElementById('ocrRunning'); if(el) el.textContent = 'OCR library unavailable offline — enter fields manually.';
    return;
  }
  Tesseract.recognize(dataUrl, 'eng')
    .then(({data:{text}})=>{
      const el = document.getElementById('ocrRunning'); if(el) el.remove();
      autoFillFromOCR(text);
    })
    .catch(()=>{
      const el = document.getElementById('ocrRunning'); if(el) el.textContent = 'OCR failed — enter fields manually.';
    });
}

function autoFillFromOCR(text){
  // amount: largest $ value found, or "TOTAL" line
  const totalMatch = text.match(/total[^\d]{0,10}(\d+\.\d{2})/i);
  const anyAmount = text.match(/\$?\s?(\d{1,4}\.\d{2})/g);
  let amount = '';
  if(totalMatch) amount = totalMatch[1];
  else if(anyAmount && anyAmount.length){
    const nums = anyAmount.map(s=>parseFloat(s.replace('$','').trim()));
    amount = Math.max(...nums).toFixed(2);
  }
  // date: common formats
  const dateMatch = text.match(/(\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4})/);
  // vendor: first non-empty line of meaningful length
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length>2);
  const vendor = lines.length ? lines[0].replace(/[^a-zA-Z0-9 &.'-]/g,'').trim() : '';

  if(amount) document.getElementById('f_amount').value = amount;
  if(dateMatch) document.getElementById('f_date').value = dateMatch[1];
  if(vendor) document.getElementById('f_vendor').value = vendor;
}

function saveEntry(){
  pendingEntry.date = document.getElementById('f_date').value;
  pendingEntry.vendor = document.getElementById('f_vendor').value;
  pendingEntry.amount = document.getElementById('f_amount').value;
  pendingEntry.category = document.getElementById('f_category').value;
  pendingEntry.notes = document.getElementById('f_notes').value;
  pendingEntry.id = Date.now();
  receipts.unshift(pendingEntry);
  saveData();
  discardEntry();
}
function discardEntry(){
  pendingEntry = null;
  document.getElementById('entryForm').style.display='none';
}

function renderTable(){
  const tb = document.getElementById('receiptBody');
  tb.innerHTML = '';
  let total = 0;
  receipts.forEach((r)=>{
    tb.innerHTML += `<tr>
      <td><img src="${r.photo}"></td>
      <td>${esc(r.date)}</td>
      <td>${esc(r.vendor)}</td>
      <td>$${esc(r.amount)}</td>
      <td>${esc(r.category)}</td>
      <td><button onclick="removeReceipt(${r.id})" style="padding:4px 8px;">✕</button></td>
    </tr>`;
    const n = parseFloat(r.amount);
    if(!isNaN(n)) total += n;
  });
  document.getElementById('grandTotal').textContent = total.toFixed(2);
  document.getElementById('receiptCount').textContent = receipts.length;
}
function removeReceipt(id){
  receipts = receipts.filter(r=>r.id!==id);
  saveData();
}
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/</g,'&lt;'); }

function exportJSON(){
  const blob = new Blob([JSON.stringify(receipts,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url; a.download = `receipt-log-${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function importJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{ receipts = JSON.parse(reader.result); saveData(); alert('Import successful.'); }
    catch(err){ alert('Invalid JSON file.'); }
  };
  reader.readAsText(file);
}
function clearAll(){ receipts = []; saveData(); }

// VOICE for quick entry without a photo (fills a pending form if open, else creates blank entry)
let recognition=null, listening=false;
function setupSpeech(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ document.getElementById('voiceStatus').textContent='Voice input not supported in this browser.'; return; }
  if(location.protocol === 'file:'){
    document.getElementById('voiceStatus').textContent = '⚠ Mic needs HTTPS or localhost — blocked on file:// pages.';
  }
  recognition = new SR();
  recognition.continuous=false; recognition.interimResults=false; recognition.lang='en-US';
  recognition.onresult = (e)=>{
    const text = e.results[0][0].transcript;
    document.getElementById('voiceStatus').textContent = 'Heard: "'+text+'"';
    parseVoiceReceipt(text);
  };
  recognition.onerror=(e)=>{ document.getElementById('voiceStatus').textContent='Mic error: '+e.error; stopMic(); };
  recognition.onend=()=>{ stopMic(); };
}
function toggleMic(){
  if(!recognition) setupSpeech();
  if(!recognition) return;
  if(listening){ recognition.stop(); stopMic(); }
  else { recognition.start(); listening=true; document.getElementById('micBtn').classList.add('listening'); document.getElementById('voiceStatus').textContent='Listening...'; }
}
function stopMic(){ listening=false; document.getElementById('micBtn').classList.remove('listening'); }

function parseVoiceReceipt(text){
  const t = text.toLowerCase();
  const amountM = t.match(/(\d+(\.\d+)?)\s*dollars?/);
  const catList = ['fuel','maintenance','toll','lodging','meals'];
  let category = 'Other';
  for(const c of catList){ if(t.includes(c)) category = c[0].toUpperCase()+c.slice(1); }
  let vendor = t.replace(/(\d+(\.\d+)?)\s*dollars?/,'').replace(new RegExp(catList.join('|'),'gi'),'').trim();

  if(document.getElementById('entryForm').style.display === 'grid'){
    if(amountM) document.getElementById('f_amount').value = amountM[1];
    if(vendor) document.getElementById('f_vendor').value = vendor;
    document.getElementById('f_category').value = category;
  } else {
    receipts.unshift({id:Date.now(), photo:'', date:'', vendor:vendor, amount: amountM?amountM[1]:'', category, notes:'(added by voice, no photo)'});
    saveData();
  }
}

loadData();
renderTable();
setupSpeech();
</script>
</body>
</html>
